<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: linear-gradient(160deg, #2A2563 0%, #3D3899 30%, #5762D5 55%, #E87A20 85%, #F5A623 100%);
      position: relative;
    }

    /* Glow effects */
    .glow-1 {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,130,31,0.25) 0%, transparent 65%);
      bottom: -200px;
      right: -150px;
    }
    .glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(87,98,213,0.3) 0%, transparent 65%);
      top: -100px;
      left: -80px;
    }
    .glow-3 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 65%);
      top: 350px;
      left: 300px;
    }

    /* Floating speech bubbles */
    .bubble {
      position: absolute;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      width: 16px;
      height: 16px;
      background: rgba(255,255,255,0.08);
      border-right: 2px solid rgba(255,255,255,0.12);
      border-bottom: 2px solid rgba(255,255,255,0.12);
      transform: rotate(45deg);
    }
    .b1 { width: 100px; height: 65px; top: 80px; right: 80px; transform: rotate(8deg); }
    .b1::after { left: 20px; }
    .b2 { width: 80px; height: 55px; top: 200px; left: 50px; transform: rotate(-5deg); }
    .b2::after { right: 15px; }
    .b3 { width: 70px; height: 48px; bottom: 250px; right: 50px; transform: rotate(4deg); }
    .b3::after { left: 15px; }
    .b4 { width: 60px; height: 42px; bottom: 350px; left: 80px; transform: rotate(-8deg); border-color: rgba(245,130,31,0.2); background: rgba(245,130,31,0.06); }
    .b4::after { right: 12px; border-color: rgba(245,130,31,0.2); background: rgba(245,130,31,0.06); }

    /* Floating emojis */
    .emoji {
      position: absolute;
      font-size: 44px;
      z-index: 1;
    }
    .e1 { top: 95px; left: 120px; transform: rotate(-12deg); }
    .e2 { top: 65px; right: 200px; transform: rotate(10deg); font-size: 36px; }
    .e3 { bottom: 310px; right: 120px; transform: rotate(-5deg); font-size: 38px; }
    .e4 { bottom: 270px; left: 100px; transform: rotate(15deg); font-size: 32px; }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px;
      gap: 50px;
    }

    /* Logo */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.9;
    }
    .logo-speak {
      font-size: 140px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -4px;
      text-transform: uppercase;
      text-shadow: 0 4px 30px rgba(0,0,0,0.2);
    }
    .logo-up {
      font-size: 140px;
      font-weight: 900;
      color: #F5821F;
      letter-spacing: -4px;
      text-transform: uppercase;
      margin-top: -5px;
      text-shadow: 0 4px 30px rgba(245,130,31,0.3);
    }

    /* Headline */
    .headline {
      font-size: 46px;
      font-weight: 800;
      color: white;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 2px 20px rgba(0,0,0,0.15);
    }

    /* CTA */
    .cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: white;
      color: #5762D5;
      font-size: 28px;
      font-weight: 800;
      padding: 24px 56px;
      border-radius: 60px;
      border: none;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    }

    .cta-btn svg {
      width: 28px;
      height: 28px;
      stroke: #F5821F;
    }

    .cta-sub {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 22px 0;
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(12px);
    }

    .bottom-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      font-weight: 600;
    }

    .bottom-item .num {
      font-size: 22px;
      font-weight: 900;
      color: #F5A623;
    }

    .dot-sep {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>

  <div class="emoji e1">💜</div>
  <div class="emoji e2">🤝</div>
  <div class="emoji e3">💪</div>
  <div class="emoji e4">🧡</div>

  <div class="container">
    <div class="logo">
      <div class="logo-speak">SPEAK</div>
      <div class="logo-up">UP</div>
    </div>

    <div class="headline">Tu n'es pas seul(e).</div>

    <div class="cta">
      <div class="cta-btn">
        Lien en bio
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7"/><path d="M7 7h10v10"/>
        </svg>
      </div>
      <div class="cta-sub">100% anonyme · 100% gratuit</div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-item"><span class="num">3018</span> Cyber</div>
    <div class="dot-sep"></div>
    <div class="bottom-item"><span class="num">3020</span> Scolaire</div>
    <div class="dot-sep"></div>
    <div class="bottom-item"><span class="num">3114</span> Urgence</div>
  </div>

</body>
</html>
