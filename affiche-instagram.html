<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1350px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: linear-gradient(180deg, #F8F5FF 0%, #F0EAFC 50%, #EBE4F9 100%);
      position: relative;
    }

    /* Border */
    .border-frame {
      position: absolute;
      inset: 16px;
      border: 2px solid rgba(139,47,201,0.12);
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 60px 0;
    }

    /* Concentric circles behind mascot */
    .halo {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 520px;
    }
    .halo-ring {
      position: absolute;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .halo-ring-1 {
      width: 520px; height: 520px;
      background: rgba(155,48,255,0.04);
    }
    .halo-ring-2 {
      width: 400px; height: 400px;
      background: rgba(155,48,255,0.06);
    }
    .halo-ring-3 {
      width: 280px; height: 280px;
      background: rgba(155,48,255,0.08);
    }

    /* Mascot */
    .mascot-wrap {
      position: relative;
      z-index: 2;
      margin-top: 20px;
    }
    .mascot {
      width: 340px;
      height: 380px;
      filter: drop-shadow(0 12px 30px rgba(100,0,180,0.18));
    }

    /* Main text */
    .main-text {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 15px;
    }

    .non {
      font-size: 150px;
      font-weight: 900;
      color: #3D2066;
      letter-spacing: 15px;
      line-height: 1;
    }

    .line {
      width: 200px;
      height: 5px;
      background: #7B3FBF;
      border-radius: 3px;
      margin: 8px 0 12px;
    }

    .harcelement {
      font-size: 56px;
      font-weight: 700;
      color: #3D2066;
      letter-spacing: 1px;
    }

    /* Slogan */
    .slogan {
      margin-top: 28px;
      font-size: 22px;
      font-weight: 700;
      color: #8B6AAE;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    /* Number boxes */
    .numbers-row {
      display: flex;
      gap: 20px;
      margin-top: 32px;
    }

    .num-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 36px;
      border-radius: 10px;
      min-width: 220px;
    }
    .num-box-light {
      background: rgba(155,48,255,0.08);
      border: 1px solid rgba(155,48,255,0.12);
    }
    .num-box-dark {
      background: #5C2D91;
    }

    .num-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .num-box-light .num-label { color: #5C2D91; }
    .num-box-dark .num-label { color: rgba(255,255,255,0.8); }

    .num-value {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.15;
    }
    .num-box-light .num-value { color: #3D2066; }
    .num-box-dark .num-value { color: #FFFFFF; }

    /* Hashtag */
    .hashtag {
      margin-top: 30px;
      font-size: 42px;
      font-weight: 800;
      color: #5C2D91;
      font-style: italic;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 50px;
      background: rgba(255,255,255,0.5);
      border-top: 1px solid rgba(139,47,201,0.1);
    }

    .bottom-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* SpeakUp logo in speech bubble */
    .logo-bubble {
      width: 60px;
      height: 50px;
      background: #1a1a1a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 8px;
    }
    .logo-bubble::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 10px;
      width: 14px;
      height: 14px;
      background: #1a1a1a;
      transform: rotate(45deg);
      border-radius: 0 0 3px 0;
    }
    .logo-bubble-text {
      color: white;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.1;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .logo-bubble-text .up {
      color: #F5821F;
    }

    .bottom-tagline {
      font-size: 16px;
      color: #3D2066;
      line-height: 1.4;
    }
    .bottom-tagline strong {
      font-weight: 800;
      color: #5C2D91;
    }

    .bottom-right {
      text-align: right;
    }
    .bottom-right-text {
      font-size: 16px;
      color: #3D2066;
      line-height: 1.4;
    }
    .bottom-right-text strong {
      font-weight: 800;
      color: #5C2D91;
    }

    /* QR code placeholder */
    .qr {
      width: 64px;
      height: 64px;
      background: #3D2066;
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 1px;
      padding: 6px;
      margin-left: auto;
      margin-top: 6px;
    }
    .qr-cell {
      border-radius: 1px;
    }
    .qr-w { background: white; }
    .qr-d { background: #3D2066; }
  </style>
</head>
<body>

  <div class="border-frame"></div>

  <!-- Halo circles -->
  <div class="halo">
    <div class="halo-ring halo-ring-1"></div>
    <div class="halo-ring halo-ring-2"></div>
    <div class="halo-ring halo-ring-3"></div>
  </div>

  <div class="container">

    <!-- Mascot -->
    <div class="mascot-wrap">
      <svg class="mascot" viewBox="0 0 500 560" xmlns="http://www.w3.org/2000/svg">
        <!-- Tail -->
        <path d="M118 415 C65 395 30 340 55 275 C65 248 80 238 90 235"
          fill="none" stroke="#1a1a1a" stroke-width="20" stroke-linecap="round"/>
        <path d="M120 413 C68 393 35 340 58 278 C68 252 82 242 90 240"
          fill="none" stroke="url(#tailGrad)" stroke-width="13" stroke-linecap="round"/>

        <!-- Body -->
        <path d="M155 330 C148 420 168 500 250 505 C332 500 352 420 345 330"
          fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="10"/>

        <!-- Head -->
        <ellipse cx="250" cy="210" rx="150" ry="145" fill="url(#headGrad)" stroke="#1a1a1a" stroke-width="10"/>

        <!-- Left ear -->
        <path d="M125 130 L65 40 L175 100" fill="url(#earGrad)" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

        <!-- Right ear -->
        <path d="M375 130 L435 40 L325 100" fill="url(#earGrad2)" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

        <!-- Left eye -->
        <ellipse cx="190" cy="200" rx="15" ry="32" fill="#1a1a1a" transform="rotate(-8 190 200)"/>

        <!-- Right eye -->
        <ellipse cx="310" cy="200" rx="15" ry="32" fill="#1a1a1a" transform="rotate(8 310 200)"/>

        <!-- Nose -->
        <ellipse cx="250" cy="255" rx="28" ry="22" fill="#5C1D99" stroke="#1a1a1a" stroke-width="6"/>
        <ellipse cx="242" cy="248" rx="9" ry="6" fill="rgba(255,255,255,0.12)" transform="rotate(-15 242 248)"/>

        <!-- Head shine -->
        <ellipse cx="205" cy="145" rx="45" ry="28" fill="rgba(255,255,255,0.12)" transform="rotate(-20 205 145)"/>

        <!-- Body shine -->
        <ellipse cx="220" cy="400" rx="20" ry="35" fill="rgba(255,255,255,0.06)" transform="rotate(-5 220 400)"/>

        <defs>
          <radialGradient id="headGrad" cx="38%" cy="32%">
            <stop offset="0%" stop-color="#C66EFF"/>
            <stop offset="40%" stop-color="#9B30FF"/>
            <stop offset="100%" stop-color="#6B0DAD"/>
          </radialGradient>
          <radialGradient id="bodyGrad" cx="40%" cy="25%">
            <stop offset="0%" stop-color="#8B20DD"/>
            <stop offset="100%" stop-color="#5A0A90"/>
          </radialGradient>
          <linearGradient id="earGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#9B30FF"/>
            <stop offset="100%" stop-color="#6B0DAD"/>
          </linearGradient>
          <linearGradient id="earGrad2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9B30FF"/>
            <stop offset="100%" stop-color="#7B1FCC"/>
          </linearGradient>
          <linearGradient id="tailGrad" x1="0" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#9B30FF"/>
            <stop offset="100%" stop-color="#7B1FCC"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- NON au harcèlement -->
    <div class="main-text">
      <div class="non">NON</div>
      <div class="line"></div>
      <div class="harcelement">au harcèlement</div>
    </div>

    <!-- Slogan -->
    <div class="slogan">Brise le silence · Parle · Agis</div>

    <!-- Numbers -->
    <div class="numbers-row">
      <div class="num-box num-box-light">
        <div class="num-label">Harcèlement scolaire</div>
        <div class="num-value">3020</div>
      </div>
      <div class="num-box num-box-dark">
        <div class="num-label">Prévention suicide</div>
        <div class="num-value">3114</div>
      </div>
    </div>

    <!-- Hashtag -->
    <div class="hashtag">#LuttonsEnsemble</div>

  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="bottom-left">
      <div class="logo-bubble">
        <div class="logo-bubble-text">SPEAK<br/><span class="up">UP</span></div>
      </div>
      <div class="bottom-tagline">
        Contre le harcèlement,<br/><strong>parlons-en.</strong>
      </div>
    </div>
    <div class="bottom-right">
      <div class="bottom-right-text">
        Tu n'es pas seul·e.<br/>Des <strong>solutions</strong> existent.
      </div>
      <div class="qr">
        <div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div>
        <div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div>
        <div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div>
        <div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div>
        <div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div>
        <div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div>
        <div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div>
        <div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-d"></div><div class="qr-cell qr-w"></div><div class="qr-cell qr-w"></div>
      </div>
    </div>
  </div>

</body>
</html>
