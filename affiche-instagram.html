<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background: linear-gradient(170deg, #FFFFFF 0%, #F5F0FF 35%, #EDE4FF 60%, #E0D4F7 100%);
      position: relative;
    }

    /* Soft decorative blobs */
    .glow-1 {
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(155,48,255,0.08) 0%, transparent 65%);
      top: -150px; right: -100px;
    }
    .glow-2 {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,0,204,0.06) 0%, transparent 65%);
      bottom: -100px; left: -80px;
    }
    .glow-3 {
      position: absolute;
      width: 350px; height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,160,255,0.12) 0%, transparent 65%);
      top: 400px; left: 150px;
    }

    /* Floating speech bubbles */
    .bubble {
      position: absolute;
      background: rgba(155,48,255,0.04);
      border: 2px solid rgba(155,48,255,0.1);
      border-radius: 18px;
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      width: 14px; height: 14px;
      background: rgba(155,48,255,0.04);
      border-right: 2px solid rgba(155,48,255,0.1);
      border-bottom: 2px solid rgba(155,48,255,0.1);
      transform: rotate(45deg);
    }
    .b1 { width: 90px; height: 58px; top: 70px; left: 70px; transform: rotate(-6deg); }
    .b1::after { right: 18px; }
    .b2 { width: 75px; height: 50px; top: 160px; right: 60px; transform: rotate(5deg); }
    .b2::after { left: 14px; }
    .b3 { width: 65px; height: 44px; bottom: 220px; left: 55px; transform: rotate(-4deg); }
    .b3::after { right: 12px; }

    /* Small floating hearts */
    .heart {
      position: absolute;
      font-size: 32px;
      z-index: 1;
      opacity: 0.6;
    }
    .h1 { top: 85px; right: 160px; transform: rotate(12deg); font-size: 28px; }
    .h2 { top: 260px; left: 65px; transform: rotate(-8deg); font-size: 24px; }
    .h3 { bottom: 260px; right: 70px; transform: rotate(6deg); font-size: 26px; }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 70px 80px;
      gap: 36px;
    }

    /* Mascot SVG */
    .mascot {
      width: 280px;
      height: 300px;
      filter: drop-shadow(0 8px 24px rgba(139,0,204,0.2));
    }

    /* Logo text */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.88;
      margin-top: -10px;
    }
    .logo-speak {
      font-size: 120px;
      font-weight: 900;
      color: #7B2FBE;
      letter-spacing: -3px;
      text-transform: uppercase;
    }
    .logo-up {
      font-size: 120px;
      font-weight: 900;
      color: #F5821F;
      letter-spacing: -3px;
      text-transform: uppercase;
      margin-top: -5px;
    }

    /* Headline */
    .headline {
      font-size: 44px;
      font-weight: 800;
      color: #2D1854;
      text-align: center;
      line-height: 1.25;
    }

    /* CTA */
    .cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #8B2FC9, #A855F7);
      color: white;
      font-size: 28px;
      font-weight: 800;
      padding: 22px 56px;
      border-radius: 60px;
      border: none;
      box-shadow: 0 6px 28px rgba(139,47,201,0.3);
    }
    .cta-btn svg {
      width: 26px; height: 26px;
      stroke: white;
    }

    .cta-sub {
      font-size: 18px;
      font-weight: 600;
      color: #9B86B5;
      letter-spacing: 0.5px;
    }

    /* Bottom bar */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 22px 0;
      background: rgba(139,47,201,0.06);
      border-top: 1px solid rgba(139,47,201,0.1);
    }
    .bottom-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7B6A8F;
      font-size: 16px;
      font-weight: 600;
    }
    .bottom-item .num {
      font-size: 22px;
      font-weight: 900;
      color: #8B2FC9;
    }
    .dot-sep {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #C8B8DA;
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="glow-3"></div>

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>

  <div class="heart h1">💜</div>
  <div class="heart h2">💜</div>
  <div class="heart h3">🧡</div>

  <div class="container">

    <!-- Mascot SVG -->
    <svg class="mascot" viewBox="0 0 500 540" xmlns="http://www.w3.org/2000/svg">
      <!-- Tail -->
      <path d="M125 430 C75 415 45 370 65 310 C75 280 85 270 90 268"
        fill="none" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
      <path d="M125 430 C75 415 45 370 65 310 C75 280 85 270 90 268"
        fill="none" stroke="#9B30FF" stroke-width="12" stroke-linecap="round"/>

      <!-- Body -->
      <path d="M160 340 C155 440 175 510 250 510 C325 510 345 440 340 340"
        fill="url(#bodyGrad)" stroke="#1a1a1a" stroke-width="10"/>
      <path d="M160 340 L160 350 C158 360 165 365 175 360"
        fill="url(#bodyGrad)" stroke="none"/>

      <!-- Head -->
      <ellipse cx="250" cy="220" rx="145" ry="140" fill="url(#headGrad)" stroke="#1a1a1a" stroke-width="10"/>

      <!-- Left ear -->
      <path d="M130 140 L75 55 L175 115" fill="url(#earGrad)" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

      <!-- Right ear -->
      <path d="M370 140 L425 55 L325 115" fill="url(#earGrad)" stroke="#1a1a1a" stroke-width="9" stroke-linejoin="round"/>

      <!-- Left eye -->
      <ellipse cx="195" cy="210" rx="14" ry="30" fill="#1a1a1a" transform="rotate(-8 195 210)"/>

      <!-- Right eye -->
      <ellipse cx="305" cy="210" rx="14" ry="30" fill="#1a1a1a" transform="rotate(8 305 210)"/>

      <!-- Nose -->
      <ellipse cx="250" cy="265" rx="25" ry="20" fill="#6B0DAD" stroke="#1a1a1a" stroke-width="6"/>
      <!-- Nose highlight -->
      <ellipse cx="243" cy="258" rx="8" ry="6" fill="rgba(255,255,255,0.15)" transform="rotate(-15 243 258)"/>

      <!-- Head shine -->
      <ellipse cx="210" cy="160" rx="40" ry="25" fill="rgba(255,255,255,0.1)" transform="rotate(-20 210 160)"/>

      <!-- Gradients -->
      <defs>
        <radialGradient id="headGrad" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#B84EFF"/>
          <stop offset="60%" stop-color="#9B30FF"/>
          <stop offset="100%" stop-color="#7B1FCC"/>
        </radialGradient>
        <radialGradient id="bodyGrad" cx="40%" cy="30%">
          <stop offset="0%" stop-color="#9B30FF"/>
          <stop offset="100%" stop-color="#6B0DAD"/>
        </radialGradient>
        <linearGradient id="earGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9B30FF"/>
          <stop offset="100%" stop-color="#7B1FCC"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- Logo -->
    <div class="logo">
      <div class="logo-speak">SPEAK</div>
      <div class="logo-up">UP</div>
    </div>

    <!-- Headline -->
    <div class="headline">Tu n'es pas seul(e).</div>

    <!-- CTA -->
    <div class="cta-wrap">
      <div class="cta-btn">
        Lien en bio
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7"/><path d="M7 7h10v10"/>
        </svg>
      </div>
      <div class="cta-sub">100% anonyme · 100% gratuit</div>
    </div>

  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="bottom-item"><span class="num">3018</span> Cyber</div>
    <div class="dot-sep"></div>
    <div class="bottom-item"><span class="num">3020</span> Scolaire</div>
    <div class="dot-sep"></div>
    <div class="bottom-item"><span class="num">3114</span> Urgence</div>
  </div>

</body>
</html>
